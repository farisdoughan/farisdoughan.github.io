name: Diagnose Pages deployment lock
on:
  push:
    paths:
      - '.github/workflows/recover-pages.yml'
permissions:
  pages: write
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect and cancel stale deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/farisdoughan/farisdoughan.github.io/pages/deployments/9d75d44c78b1544806f61f62bcd3e5b259f5420a/status
          gh api --include --method POST repos/farisdoughan/farisdoughan.github.io/pages/deployments/9d75d44c78b1544806f61f62bcd3e5b259f5420a/cancel
          gh api repos/farisdoughan/farisdoughan.github.io/pages/deployments/9d75d44c78b1544806f61f62bcd3e5b259f5420a/status
