  <title>Page not found &ndash; Faris Doughan</title>
  <script>
    (function () {
      var saved = localStorage.getItem("theme");
      var prefersDark = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches;
      var dark = saved === "dark" || (saved !== "light" && prefersDark);
      if (dark) {
        document.documentElement.setAttribute("data-theme", "dark");
        document.documentElement.style.backgroundColor = "#14141a";
      }
    })();
  </script>
  <link rel="stylesheet" href="main.css" />
</head>
