<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page not found · Faris Doughan</title>
  <script>
    (function () {
      try {
        var t = localStorage.getItem("theme");
        var dark =
          t === "dark" ||
          (t !== "light" && window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches);
        var r = document.documentElement;
        if (dark) {
          r.setAttribute("data-theme", "dark");
          r.style.backgroundColor = "#1a1a1a";
        } else {
          r.removeAttribute("data-theme");
          r.style.backgroundColor = "#ffffff";
        }
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" type="text/css" href="main.css" />
</head>
<body>
  <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Toggle dark mode">
    <span class="icon-moon" aria-hidden="true">☾</span>
    <span class="icon-sun" aria-hidden="true">☀</span>
  </button>

  <div class="grid-container">
    <div class="picture">
      <div class="nav">
        <p class="nav-photo-placeholder">A suitable photograph will be added in due course.</p>
      </div>
    </div>
    <div class="header">
      <h1> 404 </h1>
      <p>Page not found.</p>
      <p><a href="index.html">Back to home</a></p>
    </div>
  </div>
  <script src="theme.js"></script>
</body>
</html>
