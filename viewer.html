<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Faris Doughan</title>
  <script>
    (function () {
      var saved = localStorage.getItem("theme");
      var prefersDark = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches;
      var dark = saved === "dark" || (saved !== "light" && prefersDark);
      if (dark) {
        document.documentElement.setAttribute("data-theme", "dark");
        document.documentElement.style.backgroundColor = "#14141a";
      }
    })();
  </script>
  <link rel="stylesheet" href="main.css" />
  <style>
    .viewer-topbar {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 0.75rem 1.5rem;
      background: var(--panel);
      border-bottom: 1px solid var(--panel-hover);
    }

    .viewer-back {
      color: var(--text);
      text-decoration: none;
      font-size: 0.95rem;
      padding: 0.35rem 0.75rem;
      border-radius: 6px;
      transition: background 0.15s ease;
    }

    .viewer-back:hover { background: var(--panel-hover); }

    .viewer-title {
      font-size: 1rem;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }

    .viewer-frame {
      flex: 1;
      border: none;
      width: 100%;
    }

    .viewer-error {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 1.1rem;
    }

    .viewer-mobile-fallback {
      display: none;
      flex: 1;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
    }

    .viewer-mobile-fallback a {
      padding: 0.75rem 1.5rem;
      background: var(--heading);
      color: #fff;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
    }

    .viewer-mobile-fallback a:hover { opacity: 0.85; }

    body {
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    .theme-toggle { position: relative !important; top: auto !important;
      right: auto !important; z-index: auto !important; }

    @media (max-width: 767px) {
      .viewer-frame { display: none !important; }
      .viewer-mobile-fallback { display: flex !important; }
      .viewer-topbar { padding: 0.6rem 1rem; gap: 0.5rem; }
      .viewer-title { font-size: 0.85rem; }
    }
  </style>
</head>
<body>
  <div class="viewer-topbar">
    <a class="viewer-back" id="back-link" href="index.html">&larr; Back</a>
    <span class="viewer-title" id="viewer-title"></span>
    <button type="button" class="theme-toggle" id="theme-toggle"
            aria-label="Toggle dark mode">
      <span class="icon-moon" aria-hidden="true">&#x263E;</span>
      <span class="icon-sun" aria-hidden="true">&#x2600;</span>
    </button>
  </div>
  <iframe class="viewer-frame" id="pdf-frame"></iframe>
  <div class="viewer-mobile-fallback" id="mobile-fallback">
    <a id="mobile-pdf-link" href="#">Open PDF</a>
  </div>
  <div class="viewer-error" id="viewer-error" style="display:none">
    No file specified.
  </div>

  <script src="theme.js"></script>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var file = params.get("file");
      var title = params.get("title");

      if (title) {
        document.getElementById("viewer-title").textContent = title;
        document.title = title + " \u2013 Faris Doughan";
      }

      if (file) {
        document.getElementById("pdf-frame").src = file;
        var mobileLink = document.getElementById("mobile-pdf-link");
        if (mobileLink) mobileLink.href = file;
      } else {
        document.getElementById("pdf-frame").style.display = "none";
        document.getElementById("viewer-error").style.display = "flex";
      }
    })();
  </script>
</body>
</html>
